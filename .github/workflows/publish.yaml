name: Publish Helm chart to GHCR

env:
  CHART_NAME: netbird
  GHCR_REGISTRY: ghcr.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-chart
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Determine version and check it matches Chart.yaml
        run: |
          set -euo pipefail

          chart_version="$(helm show chart . | yq -r '.version')"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"

            if [ "$version" != "$chart_version" ]; then
              echo "::error::Tag says $version but Chart.yaml says $chart_version."
              echo "The chart version is what lands in helm.sh/chart on every rendered"
              echo "object, so the two must agree. Update Chart.yaml and re-tag."
              exit 1
            fi

            release=true
          else
            version="$chart_version"
            release=false
            echo "Manual run: publishing 0.0.0-latest only, not ${version}."
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semver version."
            exit 1
          fi

          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'RELEASE=%s\n' "$release" >> "$GITHUB_ENV"

      - name: Lint and render
        run: |
          set -euo pipefail
          helm lint . \
            --set global.domain.global=example.com \
            --set global.server.encryption_key=dummy \
            --set global.server.auth_secret=dummy
          helm template t . \
            --set global.domain.global=example.com \
            --set global.server.encryption_key=dummy \
            --set global.server.auth_secret=dummy > /dev/null

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p packages
          # --version sets the version inside the package and leaves Chart.yaml
          # on disk alone, so no edit-and-restore is needed.
          if [ "${RELEASE}" = "true" ]; then
            helm package . --version "${VERSION}" --destination packages
          fi
          # Moving tag, so `targetRevision: 0.0.0-latest` tracks the newest build.
          helm package . --version "0.0.0-latest" --destination packages

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" \
            | helm registry login "${GHCR_REGISTRY}" \
                --username "${GHCR_USER}" --password-stdin

      - name: Push to GHCR
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GHCR namespaces must be lowercase.
          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(basename "${REPO_FULL}")"
          dest="oci://${GHCR_REGISTRY}/${owner}/${repo}"

          versions=("0.0.0-latest")
          if [ "${RELEASE}" = "true" ]; then
            versions=("${VERSION}" "${versions[@]}")
          fi

          for v in "${versions[@]}"; do
            tgz="packages/${CHART_NAME}-${v}.tgz"
            [ -f "$tgz" ] || { echo "::error::$tgz not found"; exit 1; }
            helm push "$tgz" "$dest"
          done

          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for v in "${versions[@]}"; do
            echo "${dest}/${CHART_NAME}:${v}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
