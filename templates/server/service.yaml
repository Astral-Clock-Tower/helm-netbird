apiVersion: v1
kind: Service
metadata:
  name: {{ include "netbird.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
    netbird-app: {{ include "netbird.fullname" . }}-server
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      targetPort: http
      protocol: TCP
      appProtocol: kubernetes.io/h2c
      port: {{ .Values.global.server.port }}
{{- if .Values.global.server.stun.enabled }}
    - name: stun
      targetPort: stun
      protocol: UDP
      port: {{ include "netbird.stunPort" . }}
{{- end }}
  selector:
    {{- include "netbird.selectorLabels" . | nindent 4 }}
    netbird-app: {{ include "netbird.fullname" . }}-server
