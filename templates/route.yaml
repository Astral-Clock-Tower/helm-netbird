kind: GRPCRoute
metadata:
  name: {{ $fullName }}-server-signal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- $ann := merge (dict) (.Values.global.route.serverAnnotations | default dict) (.Values.global.route.annotations | default dict) }}
