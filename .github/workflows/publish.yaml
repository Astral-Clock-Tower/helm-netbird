name: Publish Helm chart to GHCR

env:
  CHART_NAME: netbird
  GHCR_REGISTRY: ghcr.io

on:
  pull_request:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-chart
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint and render
        run: |
          set -euo pipefail
          helm lint . \
            --set global.domain.global=example.com \
            --set global.server.encryption_key=dummy \
            --set global.server.auth_secret=dummy
          helm template t . \
            --set global.domain.global=example.com \
            --set global.server.encryption_key=dummy \
            --set global.server.auth_secret=dummy > /dev/null

  publish:
    needs: validate
    # Branches publish snapshots so work in progress can be installed. main
    # publishes nothing on its own - anything released from it is tagged, which
    # takes the release path below. Pull requests publish nothing at all.
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Determine version and check it matches Chart.yaml
        run: |
          set -euo pipefail

          chart_version="$(helm show chart . | yq -r '.version')"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"

            if [ "$version" != "$chart_version" ]; then
              echo "::error::Tag says $version but Chart.yaml says $chart_version."
              echo "The chart version is what lands in helm.sh/chart on every rendered"
              echo "object, so the two must agree. Update Chart.yaml and re-tag."
              exit 1
            fi

            kind=release
          else
            # Immutable per-commit version, so a build can be pinned and
            # rolled back to.
            #
            # A hyphen starts a prerelease, a dot extends one:
            #   1.2.0      -> 1.2.0-snapshot.abc1234
            #   2.0.0-rc.1 -> 2.0.0-rc.1.snapshot.abc1234
            # Using a hyphen on the second gives 2.0.0-rc.1-snapshot.abc1234,
            # which sorts above 2.0.0-rc.2.
            case "$chart_version" in
              *-*) version="${chart_version}.snapshot.${GITHUB_SHA:0:7}" ;;
              *)   version="${chart_version}-snapshot.${GITHUB_SHA:0:7}" ;;
            esac
            kind=snapshot
            echo "Snapshot build: ${version}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semver version."
            exit 1
          fi

          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'KIND=%s\n' "$kind" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p packages
          # --version sets the version inside the package and leaves Chart.yaml
          # on disk alone, so no edit-and-restore is needed.
          #
          # VERSION is immutable either way now - a release tag or a
          # commit-derived snapshot - so it is always worth publishing.
          helm package . --version "${VERSION}" --destination packages

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" \
            | helm registry login "${GHCR_REGISTRY}" \
                --username "${GHCR_USER}" --password-stdin

      - name: Push to GHCR
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GHCR namespaces must be lowercase.
          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(basename "${REPO_FULL}")"
          dest="oci://${GHCR_REGISTRY}/${owner}/${repo}"

          tgz="packages/${CHART_NAME}-${VERSION}.tgz"
          [ -f "$tgz" ] || { echo "::error::$tgz not found"; exit 1; }
          helm push "$tgz" "$dest"

          {
            echo "### Published (${KIND})"
            echo '```'
            echo "${dest}/${CHART_NAME}:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
