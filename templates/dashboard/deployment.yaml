{{- /* Also checked here: this always renders, secret.yaml does not. */ -}}
{{- include "netbird.validateAuthHost" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "netbird.fullname" . }}-dashboard"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
    netbird-app: {{ include "netbird.fullname" . }}-dashboard
  {{- with .Values.dashboard.deploymentAnnotations }}
  annotations:
    {{- /*
    Quoted rather than toYaml'd: annotation values must be strings, and the
    canonical value here is `reloader.stakater.com/auto: "true"`, which YAML
    reads as a boolean unless the author remembers the quotes. Unquoted it is
    rejected at apply time with "cannot unmarshal bool into ... annotations of
    type string", which does not name the annotation that caused it.
    */}}
    {{- range $k, $v := . }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      netbird-app: {{ include "netbird.fullname" . }}-dashboard
      {{- include "netbird.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.dashboard.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        netbird-app: {{ include "netbird.fullname" . }}-dashboard
        {{- include "netbird.labels" . | nindent 8 }}
        {{- with .Values.dashboard.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "netbird.serviceAccountName" . }}
      {{- with .Values.dashboard.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          {{- with .Values.dashboard.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: NETBIRD_MGMT_API_ENDPOINT
              value: "https://{{ .Values.global.domain.global }}:443"
            - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
              value: "https://{{ .Values.global.domain.global }}:443"
            - name: AUTH_AUDIENCE
              value: {{ .Values.global.auth.audience | default "netbird-dashboard" | quote }}
            - name: AUTH_CLIENT_ID
            {{- if .Values.global.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.auth.existingSecret }}
                  key: {{ .Values.global.auth.existingSecretClientIdKey | default "clientId" }}
            {{- else }}
              value: {{ .Values.global.auth.clientId | default "netbird-dashboard" | quote }}
            {{- end }}
            - name: AUTH_CLIENT_SECRET
            {{- if .Values.global.auth.publicClient }}
              value: ""
            {{- else if .Values.global.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.auth.existingSecret }}
                  key: {{ .Values.global.auth.existingSecretClientSecretKey | default "clientSecret" }}
            {{- else }}
              value: {{ .Values.global.auth.clientSecret | quote }}
            {{- end }}
            - name: AUTH_AUTHORITY
              value: {{ .Values.global.auth.authority | default (printf "https://%s/oauth2" .Values.global.domain.global) | quote }}
            - name: USE_AUTH0
              value: '{{ .Values.global.auth.useAuth0 | default false }}'
            - name: AUTH_SUPPORTED_SCOPES
              value: {{ .Values.global.auth.supportedScopes | default "openid profile email groups" | quote }}
            - name: AUTH_REDIRECT_URI
              value: {{ .Values.global.auth.redirectURI | default "/nb-auth" | quote }}
            - name: AUTH_SILENT_REDIRECT_URI
              value: {{ .Values.global.auth.silentRedirectURI | default "/nb-silent-auth" | quote }}
            - name: NGINX_SSL_PORT
              value: "443"
            - name: LETSENCRYPT_DOMAIN
              value: {{ .Values.dashboard.letsencrypt.domain | quote }}
            {{- with .Values.dashboard.letsencrypt.email }}
            - name: LETSENCRYPT_EMAIL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dashboard.extra_env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- if .Values.dashboard.livenessProbe }}
            {{- toYaml .Values.dashboard.livenessProbe | nindent 12 }}
            {{- else }}
              httpGet:
                path: /
                port: http
              initialDelaySeconds: 15
              periodSeconds: 60
            {{- end }}
          readinessProbe:
            {{- if .Values.dashboard.readinessProbe }}
            {{- toYaml .Values.dashboard.readinessProbe | nindent 12 }}
            {{- else }}
              httpGet:
                path: /
                port: http
              initialDelaySeconds: 15
              periodSeconds: 60
            {{- end }}
          {{- with .Values.dashboard.resources }}
          resources:
                {{- toYaml . | nindent 12 }}
              {{- end }}
          volumeMounts:
            {{- toYaml .Values.dashboard.extra_volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.dashboard.extra_volumes | nindent 8 }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
