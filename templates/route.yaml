{{ if eq .Values.global.route.vendor "envoy" -}}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullName }}-server-timeouts
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: 'gateway.networking.k8s.io'
      kind: HTTPRoute
      name: {{ $fullName }}-server
  timeout:
    http:
      {{- /*
      A BackendTrafficPolicy targets a whole route, so this applies to the
      /relay and /ws-proxy rule too - and 86400s would have closed an idle relay
      connection after a day, contradicting the `request: 0s` those paths are
      given above. 0s disables the idle timeout; the tcpKeepalive below still
      reaps genuinely dead peers in about five minutes.
      */}}
      connectionIdleTimeout: 0s
  tcpKeepalive:
    idleTime: 30s
    interval: 30s
    probes: 5

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullName }}-server-management-timeouts
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: 'gateway.networking.k8s.io'
      kind: GRPCRoute
      name: {{ $fullName }}-server-management
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 86400s
  tcpKeepalive:
    idleTime: 30s
    interval: 30s
    probes: 5

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullName }}-server-signal-timeouts
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: 'gateway.networking.k8s.io'
      kind: GRPCRoute
      name: {{ $fullName }}-server-signal
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 86400s
  tcpKeepalive:
    idleTime: 30s
    interval: 30s
    probes: 5
{{- end }}



{{- end }}
