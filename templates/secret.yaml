{{- include "netbird.validateAuthHost" . -}}
{{- $auth := .Values.global.auth -}}
{{- $mfa := default dict $auth.mfa -}}
{{- $owner := default dict $auth.owner -}}
{{- $store := default dict .Values.global.server.store -}}
{{- $activityStore := default dict .Values.global.server.activityStore -}}
{{- $authStore := default dict .Values.global.server.authStore -}}
{{- /*
existingConfigSecret replaces this file, so anything reaching NetBird only
through it would silently stop applying. Fail instead: under GitOps a render
error lands in the sync status, a value that quietly stopped applying does not.
*/ -}}
{{- if .Values.global.server.existingConfigSecret }}
{{- $dropped := list -}}
{{- $configOnly := dict -}}
{{- $_ := set $configOnly "global.server.encryption_key" .Values.global.server.encryption_key -}}
{{- $_ := set $configOnly "global.server.auth_secret" .Values.global.server.auth_secret -}}
{{- $_ := set $configOnly "global.server.stun.external" .Values.global.server.stun.external -}}
{{- $_ := set $configOnly "global.server.store.engine" $store.engine -}}
{{- $_ := set $configOnly "global.server.store.dsn" $store.dsn -}}
{{- $_ := set $configOnly "global.server.activityStore.engine" $activityStore.engine -}}
{{- $_ := set $configOnly "global.server.activityStore.dsn" $activityStore.dsn -}}
{{- $_ := set $configOnly "global.server.activityStore.file" $activityStore.file -}}
{{- $_ := set $configOnly "global.server.authStore.engine" $authStore.engine -}}
{{- $_ := set $configOnly "global.server.authStore.dsn" $authStore.dsn -}}
{{- $_ := set $configOnly "global.server.authStore.file" $authStore.file -}}
{{- $_ := set $configOnly "global.auth.issuerUrl" $auth.issuerUrl -}}
{{- $_ := set $configOnly "global.auth.localAuthDisabled" $auth.localAuthDisabled -}}
{{- $_ := set $configOnly "global.auth.cliRedirectURIs" $auth.cliRedirectURIs -}}
{{- $_ := set $configOnly "global.auth.postLogoutRedirectURIs" $auth.postLogoutRedirectURIs -}}
{{- $_ := set $configOnly "global.auth.grantTypes" $auth.grantTypes -}}
{{- $_ := set $configOnly "global.auth.sessionCookieEncryptionKey" $auth.sessionCookieEncryptionKey -}}
{{- $_ := set $configOnly "global.auth.owner.email" $owner.email -}}
{{- $_ := set $configOnly "global.auth.mfa.sessionMaxLifetime" $mfa.sessionMaxLifetime -}}
{{- $_ := set $configOnly "global.auth.mfa.sessionIdleTimeout" $mfa.sessionIdleTimeout -}}
{{- $_ := set $configOnly "global.auth.mfa.sessionRememberMe" $mfa.sessionRememberMe -}}
{{- range $k, $v := $configOnly }}{{- if not (empty $v) }}{{- $dropped = append $dropped $k -}}{{- end }}{{- end }}
{{- /*
reverseProxy ships a non-empty default, so "set" has to mean "differs from that
default" - otherwise every existingConfigSecret install fails on a value it
never touched.
*/ -}}
{{- $rp := include "netbird.reverseProxy" . | fromYaml -}}
{{- if and $rp (ne (toYaml $rp) (toYaml (dict "trustedHTTPProxies" (list "0.0.0.0/0")))) }}
{{- $dropped = append $dropped "global.server.reverseProxy" -}}
{{- end }}
{{- if $dropped }}
{{- fail (printf "%s only reach NetBird through the config.yaml this chart renders, and global.server.existingConfigSecret (%s) replaces it. Put them in that Secret and unset them here, or drop existingConfigSecret." (join ", " (sortAlpha $dropped)) .Values.global.server.existingConfigSecret) }}
{{- end }}
{{- end }}
{{- if not .Values.global.server.existingConfigSecret }}
{{- /*
Checked here because the server only reveals these at boot, as a CrashLoopBackOff
whose reason is one line deep in a pod log.

Why the three differ: the main store's dsn may be omitted, since NetBird copies
it over NB_STORE_ENGINE_*_DSN only when non-empty and an external one then
survives - so its check is against server.extra_env rather than the file. The
activity store is rejected before anything reads the environment once its engine
is named here. The embedded IdP has no environment variable at all.
*/ -}}
{{- $storeEngine := $store.engine | default "sqlite" | lower -}}
{{- if not (has $storeEngine (list "sqlite" "postgres" "mysql")) -}}
{{- fail (printf "global.server.store.engine is %q. NetBird's main store supports sqlite, postgres or mysql." $store.engine) -}}
{{- end -}}
{{- $dsnEnv := dict "postgres" "NB_STORE_ENGINE_POSTGRES_DSN" "mysql" "NB_STORE_ENGINE_MYSQL_DSN" -}}
{{- if and (hasKey $dsnEnv $storeEngine) (not $store.dsn) -}}
{{- $var := index $dsnEnv $storeEngine -}}
{{- $legacy := printf "NETBIRD_%s" (trimPrefix "NB_" $var) -}}
{{- $names := list -}}
{{- range (default (list) .Values.server.extra_env) -}}
{{- $names = append $names (.name | default "") -}}
{{- end -}}
{{- if not (or (has $var $names) (has $legacy $names)) -}}
{{- fail (printf "global.server.store.engine is %q but no connection string is set. Either set global.server.store.dsn, or leave it empty and set %s in server.extra_env - from a secretKeyRef, so the password stays out of the rendered config." $storeEngine $var) -}}
{{- end -}}
{{- end -}}
{{- $activityEngine := $activityStore.engine | default "" | lower -}}
{{- if and $activityEngine (not (has $activityEngine (list "sqlite" "postgres"))) -}}
{{- fail (printf "global.server.activityStore.engine is %q. NetBird's activity store supports sqlite or postgres." $activityStore.engine) -}}
{{- end -}}
{{- if and (eq $activityEngine "postgres") (not $activityStore.dsn) -}}
{{- fail "global.server.activityStore.engine is postgres, so global.server.activityStore.dsn is required: NetBird rejects that pair at startup, before it reads the environment. To keep the connection string in a Secret, unset this whole block and set NB_ACTIVITY_EVENT_STORE_ENGINE and NB_ACTIVITY_EVENT_POSTGRES_DSN in server.extra_env instead." -}}
{{- end -}}
{{- if and (eq ($authStore.engine | default "" | lower) "postgres") (not $authStore.dsn) -}}
{{- fail "global.server.authStore.engine is postgres, so global.server.authStore.dsn is required. The embedded IdP's connection string is the one NetBird reads only from config.yaml - there is no environment variable for it, so server.extra_env cannot stand in." -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netbird.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
stringData:
  config.yaml: |
    server:
      listenAddress: ":{{ .Values.global.server.port }}"
      exposedAddress: "https://{{ .Values.global.domain.global }}:443"
{{- if .Values.global.server.stun.enabled }}
      stunPorts:
        - {{ include "netbird.stunPort" . }}
{{- end }}
{{- with .Values.global.server.stun.external }}
      stuns:
        {{- toYaml . | nindent 8 }}
{{- end }}
      metricsPort: {{ .Values.global.server.metrics.port | default 9090 }}
      healthcheckAddress: ":9000"
      logLevel: "info"
      logFile: "console"
    
      authSecret: {{ required "global.server.auth_secret is required. Generate one with `openssl rand -base64 32`." .Values.global.server.auth_secret | quote }}
      dataDir: {{ .Values.server.persistence.dataDir }}
    
      auth:
        issuer: {{ include "netbird.authIssuer" . | quote }}
        signKeyRefreshEnabled: true
        {{- with $auth.localAuthDisabled }}
        localAuthDisabled: true
        {{- end }}
        dashboardRedirectURIs:
          - "https://{{ .Values.global.domain.global }}{{ $auth.redirectURI | default "/nb-auth" }}"
          - "https://{{ .Values.global.domain.global }}{{ $auth.silentRedirectURI | default "/nb-silent-auth" }}"
        cliRedirectURIs:
          {{- toYaml ($auth.cliRedirectURIs | default (list "http://localhost:53000/")) | nindent 10 }}
        {{- with $auth.postLogoutRedirectURIs }}
        dashboardPostLogoutRedirectURIs:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $auth.grantTypes }}
        grantTypes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $auth.sessionCookieEncryptionKey }}
        sessionCookieEncryptionKey: {{ . | quote }}
        {{- end }}
        {{- with $mfa.sessionMaxLifetime }}
        mfaSessionMaxLifetime: {{ . | quote }}
        {{- end }}
        {{- with $mfa.sessionIdleTimeout }}
        mfaSessionIdleTimeout: {{ . | quote }}
        {{- end }}
        {{- with $mfa.sessionRememberMe }}
        mfaSessionRememberMe: true
        {{- end }}
        {{- if $owner.email }}
        {{- $hash := required "global.auth.owner.passwordHash is required when global.auth.owner.email is set." $owner.passwordHash }}
        {{- if not (hasPrefix "$2" $hash) }}
        {{- fail (printf "global.auth.owner.passwordHash must be a bcrypt hash, not a plaintext password - NetBird stores it verbatim as the hash, so plaintext yields an account nobody can log into. Got %q... Generate one with: htpasswd -bnBC 10 \"\" 'yourpassword' | tr -d ':\\n'" (trunc 4 $hash)) }}
        {{- end }}
        {{- /* Named `password` upstream; the value is the hash. */}}
        owner:
          email: {{ $owner.email | quote }}
          password: {{ $hash | quote }}
        {{- end }}

      {{- /*
      Passed through key for key, so any field NetBird's reverseProxy block
      accepts is reachable without a chart change. Empty values are dropped
      rather than emitted, so an unset field falls back to NetBird's own
      default instead of being overwritten with a zero value.
      */ -}}
      {{- with (include "netbird.reverseProxy" . | fromYaml) }}
      reverseProxy:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      store:
        engine: {{ $storeEngine | quote }}
        {{- with $store.dsn }}
        dsn: {{ . | quote }}
        {{- end }}
        encryptionKey: {{ required "global.server.encryption_key is required. Generate one with `openssl rand -base64 32`." .Values.global.server.encryption_key | quote }}
      {{- /* Its own database; defaults to sqlite at <dataDir>/events.db. */ -}}
      {{- if or $activityStore.engine $activityStore.dsn $activityStore.file }}
      activityStore:
        {{- with $activityStore.engine }}
        engine: {{ . | quote }}
        {{- end }}
        {{- with $activityStore.dsn }}
        dsn: {{ . | quote }}
        {{- end }}
        {{- with $activityStore.file }}
        file: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- /* Separate from the store above; defaults to sqlite in dataDir. */ -}}
      {{- if or $authStore.engine $authStore.dsn $authStore.file }}
      authStore:
        {{- with $authStore.engine }}
        engine: {{ . | quote }}
        {{- end }}
        {{- with $authStore.dsn }}
        dsn: {{ . | quote }}
        {{- end }}
        {{- with $authStore.file }}
        file: {{ . | quote }}
        {{- end }}
      {{- end }}
{{- end }}
