{{- if .Values.global.route.enabled -}}
{{- $fullName := include "netbird.fullname" . -}}
{{- $host := required "global.domain.global is required when global.route.enabled is set: every route the chart renders uses it as its hostname." .Values.global.domain.global -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- $ann := merge (dict) (.Values.global.route.serverAnnotations | default dict) (.Values.global.route.annotations | default dict) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    # Streaming paths (/relay and /ws-proxy) must stay open forever.
    # We use '0s' because any other timeout will force-close the connection.
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-server-http
          port: {{ .Values.global.server.port }}
      matches:
        - path:
            type: PathPrefix
            value: /ws-proxy
        - path:
            type: PathPrefix
            value: /relay
      timeouts:
        request: 0s
    # Ordinary request/response API traffic.
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-server-http
          port: {{ .Values.global.server.port }}
      matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /oauth2
      timeouts:
        request: {{ .Values.global.route.apiTimeout | default "3600s" }}
        backendRequest: {{ .Values.global.route.apiTimeout | default "3600s" }}


---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- $ann := merge (dict) (.Values.global.route.dashboardAnnotations | default dict) (.Values.global.route.annotations | default dict) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-dashboard
          port: {{ .Values.global.dashboard.port }}
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 3600s
        backendRequest: 3600s



{{- if and .Values.global.server.stun.enabled .Values.global.route.stunParentRefs }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: {{ $fullName }}-stun
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "netbird.labels" $ | nindent 4 }}
  {{- $ann := merge (dict) ($.Values.global.route.stunAnnotations | default dict) ($.Values.global.route.annotations | default dict) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.global.route.stunParentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-server
          port: {{ include "netbird.stunPort" $ }}
{{- end }}



---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ $fullName }}-server-management
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
  {{- $ann := merge (dict) (.Values.global.route.serverAnnotations | default dict) (.Values.global.route.annotations | default dict) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.global.route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}-server
          port: {{ .Values.global.server.port }}
      matches:
        - method:
            type: Exact
            service: management.ManagementService



